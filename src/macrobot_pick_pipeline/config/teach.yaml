macrobot_pick_teach:
  ros__parameters:
    base_frame: base_link
    use_finder: true
    allow_motion_commands: true

    target_min_score: 0.55
    target_stability_count: 5
    target_stability_window_sec: 1.5
    target_stability_radius_m: 0.012
    target_lock_timeout_sec: 30.0
    motion_timeout_sec: 25.0
    timer_rate_hz: 20.0

    command_topic: /macrobot/pick/teach/command
    status_topic: /macrobot/pick/teach/status
    result_topic: /macrobot/pick/teach/result
    marker_topic: /macrobot/pick/teach/markers
