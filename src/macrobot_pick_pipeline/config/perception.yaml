macrobot_detection_localizer:
  ros__parameters:
    input_mode: legacy
    finder_result_topic: /object_finder/result
    typed_confirmation_topic: /temporal_confirmation/confirmed
    camera_info_topic: /camera/camera/color/camera_info
    aligned_depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    active_target_topic: /macrobot/pick/active_target
    localized_detection_topic: /macrobot/perception/localized_detection
    point_topic: /macrobot/perception/object_point
    status_topic: /macrobot/perception/localizer_status
    base_frame: base_link
    optical_frame_override: camera_color_optical_frame
    minimum_score: 0.0
    require_patch_localization: true
    minimum_localization_quality: 0.15
    minimum_depth_m: 0.08
    maximum_depth_m: 2.0
    tf_timeout_sec: 0.2
    use_local_depth_refinement: true
    depth_buffer_size: 90
    depth_sync_tolerance_sec: 0.3
    depth_window_radius_px: 5
    depth_minimum_samples: 12
    depth_inlier_band_m: 0.08
    depth_maximum_std_m: 0.04
    depth_maximum_mad_m: 0.025
    allow_candidate_depth_fallback: false
    depth_scale_m: 0.001
    # Fast coarse-to-fine docking and depth-assisted 3-D orientation.
    enable_depth_axis_3d: true
    orientation_3d_sample_count: 11
    orientation_3d_minor_track_count: 3
    orientation_3d_strip_half_width_ratio: 0.12
    orientation_3d_window_radius_px: 2
    orientation_3d_minimum_valid_samples: 9
    orientation_3d_depth_gate_m: 0.06
    orientation_3d_minimum_span_m: 0.018
    orientation_3d_maximum_residual_m: 0.012
    orientation_3d_minimum_horizontal_ratio: 0.3
    orientation_3d_allow_center_depth_fallback: true
    orientation_2d_fallback_quality_scale: 0.35
    # Upright-object face-normal estimator.
    enable_upright_face_3d: true
    upright_face_roi_inset_ratio: 0.1
    upright_face_top_exclusion_ratio: 0.06
    upright_face_bottom_exclusion_ratio: 0.18
    upright_face_sample_stride_px: 2
    upright_face_maximum_points: 1400
    upright_face_depth_gate_m: 0.055
    upright_face_minimum_points: 60
    upright_face_ransac_iterations: 96
    upright_face_inlier_threshold_m: 0.006
    upright_face_minimum_inlier_ratio: 0.35
    upright_face_maximum_abs_normal_z: 0.35
    upright_face_maximum_median_residual_m: 0.006
    upright_face_minimum_horizontal_span_m: 0.008
    upright_face_minimum_vertical_span_m: 0.025
    upright_face_maximum_center_plane_distance_m: 0.018
