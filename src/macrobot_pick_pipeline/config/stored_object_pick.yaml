    alignment_move_speed: 80
    coarse_turn_speed: 150
    coarse_move_speed: 80
    coarse_allow_reverse: true
    coarse_reverse_heading_tolerance_deg: 90.0
    base_motion_timeout_sec: 10.0
    settle_sec: 0.45
    max_alignment_iterations: 20
    max_alignment_total_turn_deg: 120.0
    max_alignment_total_move_m: 0.6
    alignment_confirmation_count: 2
    record_timeout_sec: 30.0
    visible_test_timeout_sec: 60.0
    full_search_timeout_sec: 90.0
    finder_initial_detection_wait_sec: 3.0
    search_post_turn_detection_wait_sec: 3.0
    search_post_turn_frame_guard_sec: 0.3
    perception_pipeline_stall_timeout_sec: 6.0
    perception_evidence_grace_sec: 2.5
    perception_view_max_wait_sec: 8.0
    localization_stability_timeout_sec: 8.0
