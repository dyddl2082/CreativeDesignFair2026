macrobot_stored_object_pick:
  ros__parameters:
    profile_file: ~/MacRobot/data/stored_objects/runtime_profiles.yaml
    recordings_dir: ~/MacRobot/data/arm_primitives
    grasp_keyframe_profile_file: ~/MacRobot/data/grasp_keyframes/profiles.yaml
    object_memory_file: ~/MacRobot/data/object_memory/memory.yaml
    base_frame: base_link
    forward_axis_sign: 1.0
    lateral_axis_sign: 1.0
    pico_turn_positive_is_right: false
    pico_move_positive_is_forward: true
    dry_run_base: false
    stow_before_base_motion: true
    stow_q:
    - 0.0
    - 0.0
    - 0.0
    stow_timeout_sec: 20.0
    minimum_score: 0.0
    stability_count: 5
    stability_window_sec: 1.5
    stability_radius_m: 0.012
    minimum_localization_quality: 0.15
    maximum_depth_std_m: 0.035
    maximum_center_std_px: 20.0
    require_orientation_match: false
    minimum_orientation_quality: 0.45
    auto_require_orientation_quality: 0.45
    orientation_tolerance_deg: 10.0
    bearing_tolerance_deg: 1.0
    range_tolerance_m: 0.008
    height_tolerance_m: 0.03
    max_turn_step_deg: 4.0
    max_move_step_m: 0.04
    alignment_turn_speed: 150
    alignment_move_speed: 80
    coarse_turn_speed: 150
    coarse_move_speed: 80
    coarse_allow_reverse: true
    coarse_reverse_heading_tolerance_deg: 90.0
    base_motion_timeout_sec: 10.0
    settle_sec: 0.45
    max_alignment_iterations: 20
    max_alignment_total_turn_deg: 120.0
    max_alignment_total_move_m: 0.6
    alignment_confirmation_count: 2
    record_timeout_sec: 240.0
    visible_test_timeout_sec: 2400.0
    full_search_timeout_sec: 0.0
    finder_initial_detection_wait_sec: 3.0
    search_post_turn_detection_wait_sec: 3.0
    search_post_turn_frame_guard_sec: 0.3
    perception_pipeline_stall_timeout_sec: 6.0
    perception_evidence_grace_sec: 2.5
    perception_view_max_wait_sec: 8.0
    localization_stability_timeout_sec: 8.0
    localization_idle_timeout_sec: 3.0
    perception_latency_log_enabled: true
    perception_latency_log_file: ~/MacRobot/data/perception/finder_latency.jsonl
    visible_first_enabled: true
    visible_first_probe_sec: 3.0
    overall_timeout_sec: 2400.0
    odom_request_timeout_sec: 2.0
    cancel_confirm_timeout_sec: 4.0
    distance_handoff_enabled: false
    recognition_min_range_m: 0.32
    recognition_max_range_m: 1.2
    graspable_min_range_m: 0.08
    graspable_max_range_m: 0.3
    approach_position_tolerance_m: 0.012
    approach_angle_tolerance_deg: 2.0
    approach_max_move_step_m: 0.1
    approach_max_turn_step_deg: 4.0
    approach_max_iterations: 16
    approach_max_total_move_m: 0.8
    approach_max_total_turn_deg: 180.0
    base_linear_error_fraction: 0.015
    base_turn_error_fraction: 0.02
    turn_translation_drift_m_per_360: 0.01
    maximum_handoff_uncertainty_m: 0.025
    maximum_object_relocation_m: 1.0
    pico_reboot_tolerance_ms: 2000
    allow_missing_grasp_trajectory: false
    forward_clearance_topic: /macrobot/perception/forward_clearance
    require_depth_clearance: true
    clearance_max_age_sec: 0.75
    clearance_stop_margin_m: 0.12
    search_forward_step_m: 0.0
    search_forward_steps: 0
    search_observation_sec: 3.0
    search_yaw_step_deg: 10.0
    search_yaw_levels: 3
    search_max_total_move_m: 0.12
    search_max_total_turn_deg: 395.0
    use_same_epoch_location_hint: false
    location_hint_max_age_sec: 900.0
    location_hint_max_bearing_deg: 40.0
    location_hint_turn_step_deg: 10.0
    resilient_stability_count: 2
    delayed_detection_max_age_sec: 8.0
    pose_history_stationary_tolerance_sec: 8.0
    visual_move_chunk_m: 0.012
    visual_turn_chunk_deg: 4.0
    visual_reobserve_sec: 0.8
    visual_lost_timeout_sec: 8.0
    near_visual_handoff_range_m: 0.36
    maximum_near_deadreckon_m: 0.0
    resilient_alignment_confirmation_count: 2
    place_default_offset_base:
    - 0.0
    - 0.12
    - 0.0
    place_min_horizontal_offset_m: 0.08
    place_max_horizontal_offset_m: 0.25
    place_max_vertical_offset_m: 0.05
    state_heartbeat_sec: 2.0

    # Camera-authoritative execution. Persistent odometry never selects a
    # destination. Encoder feedback is used only inside one bounded motion;
    # every motion is followed by a new RGB-D localization before replanning.
    camera_authoritative_mode: true
    camera_record_min_orientation_quality: 0.45
    camera_record_max_point_radius_m: 0.008
    camera_record_max_orientation_spread_deg: 8.0
    camera_final_visual_confirmation_count: 2
    camera_final_visual_lost_restart_sec: 8.0
    camera_motion_frame_guard_sec: 0.25
    camera_max_translation_chunk_m: 0.012
    camera_search_backoff_chunk_m: 0.02
    camera_search_turn_chunk_deg: 10.0
    camera_disable_location_memory: true
    camera_disable_distance_handoff: true
    camera_allow_legacy_record_commands: false
    camera_profile_position_scope: camera_relative
    timer_rate_hz: 20.0
    search_initial_observation_sec: 4.0
    search_close_obstacle_backoff_enabled: true
    search_close_obstacle_threshold_m: 0.38
    search_close_obstacle_backoff_step_m: 0.02
    search_close_obstacle_backoff_steps: 2
    arm_execution_watchdog_sec: 180.0
    arm_preflight_watchdog_sec: 30.0
    finder_search_timeout_sec: 600.0
    orientation_alignment_enabled: true
    orientation_auto_reference_quality: 0.45
    orientation_probe_close_margin_m: 0.04
    orientation_probe_min_improvement: 0.04
    orientation_probe_move_m: 0.018
    orientation_probe_turn_deg: 3.0
    post_motion_frame_guard_sec: 0.2
    recoverable_retry_sec: 1.0
    require_fresh_visual_for_translation: true
    search_full_rotation_deg: 360.0
    search_max_overscan_deg: 30.0
    search_rotation_completion_tolerance_deg: 5.0
    search_turn_direction: 1
    terminal_overall_timeout_enabled: false
    terminal_search_timeout_enabled: false
    record_grasp_live_visual: true
    record_grasp_min_orientation_quality: 0.45
    precision_docking_enabled: true
    precision_stability_count: 4
    precision_stability_window_sec: 2.5
    precision_stability_radius_m: 0.008
    precision_bearing_tolerance_deg: 1.0
    precision_forward_tolerance_m: 0.005
    precision_lateral_tolerance_m: 0.005
    precision_turn_chunk_deg: 1.5
    precision_move_chunk_m: 0.012
    precision_confirmation_count: 3
    precision_orientation_min_quality: 0.45
    precision_orientation_tolerance_deg: 4.0
    orientation_probe_fine_turn_deg: 1.0
    orientation_probe_fine_move_m: 0.01
    # Fast coarse-to-fine docking and depth-assisted 3-D orientation.
    fast_docking_enabled: false
    fast_coarse_move_chunk_m: 0.03
    fast_coarse_bearing_tolerance_deg: 4.0
    fast_emergency_bearing_tolerance_deg: 7.0
    fast_coarse_lateral_tolerance_m: 0.025
    fast_coarse_turn_chunk_deg: 6.0
    fast_final_forward_band_m: 0.035
    fast_max_translation_streak: 3
    fast_orientation_engage_forward_m: 0.025
    fast_orientation_engage_lateral_m: 0.015
    fast_orientation_engage_bearing_deg: 3.0
    fast_direct_3d_orientation_enabled: false
    fast_direct_3d_turn_gain: 1.0
    fast_direct_3d_turn_max_deg: 6.0
    fast_direct_3d_turn_min_deg: 0.75
    fast_coarse_settle_sec: 0.2
    fast_final_settle_sec: 0.35
    fast_reobserve_sec: 0.3
    camera_max_turn_chunk_deg: 4.0
    # macrobot_camera_reset_pose_relocation_v1
# pose_relocation_emergency_disable_2026_09_08
    pose_relocation_enabled: false
    pose_relocation_viewpoint_gain: 0.25
    pose_relocation_range_gain: 0.35
    pose_relocation_orbit_bearing_tolerance_deg: 5.0
    pose_relocation_orbit_range_tolerance_m: 0.025
    pose_relocation_orientation_reentry_deg: 6.0
    pose_relocation_viewpoint_confirmation_count: 1
    pose_relocation_max_viewpoint_translation_m: 0.03
    pose_relocation_max_range_translation_m: 0.02
    pose_relocation_max_turn_primitive_deg: 8.0
    pose_relocation_minimum_object_range_m: 0.1
    pose_relocation_allow_reverse: false
    pose_relocation_reverse_turn_penalty_deg: 10.0
    pose_relocation_min_turn_deg: 0.5
    pose_relocation_min_move_m: 0.003
    pose_relocation_settle_sec: 0.2
    pose_relocation_reobserve_sec: 0.25
    pose_relocation_clearance_heading_limit_deg: 20.0
    pose_relocation_prefer_drive_rel: false
    pose_relocation_max_drive_yaw_deg: 6.0
    pose_relocation_min_drive_radius_m: 0.08
    pose_relocation_drive_speed: 0
    # macrobot_axis_coupled_macro_v3 BEGIN
    # Recreate the taught camera-relative object point and axial direction as a
    # single SE(2) target.  Outside the final grasp-axis corridor, only a true
    # DRIVE_REL arc or an atomic TURN-MOVE-TURN dog-leg may be selected.
    joint_pose_controller_enabled: true

    # A local sideways correction may require reverse motion.  The platform has
    # no rear depth-clearance sensor, so reverse remains disabled until the
    # operator has physically checked the complete rear swept corridor and ACKs.
    joint_pose_allow_reverse: true
    joint_pose_rear_clearance_ack: false
    joint_pose_drive_enabled: true
    joint_pose_position_only_when_orientation_unreliable: true

    # Low-level local motion bounds.
    joint_pose_maximum_move_step_m: 0.018
    joint_pose_maximum_reverse_step_m: 0.012
    joint_pose_maximum_turn_step_deg: 8.0
    joint_pose_maximum_drive_yaw_deg: 6.0
    joint_pose_minimum_move_step_m: 0.003
    joint_pose_minimum_turn_step_deg: 0.5
    joint_pose_turn_action_levels: 3
    joint_pose_move_action_levels: 3

    # Predicted camera/FOV/object-clearance envelope.
    joint_pose_minimum_object_range_m: 0.10
    joint_pose_maximum_object_range_m: 0.80
    joint_pose_minimum_object_forward_m: 0.04
    joint_pose_maximum_predicted_bearing_deg: 48.0
    joint_pose_path_sample_count: 9

    # Desired final-axis coordinates and cost.  Cross-track is measured in the
    # desired final robot-axis frame, not as image bearing.
    joint_pose_axis_corridor_tolerance_m: 0.008
    joint_pose_axis_turn_position_gate_m: 0.014
    joint_pose_axis_straight_heading_gate_deg: 5.0
    joint_pose_axis_cross_track_weight: 2.8
    joint_pose_axis_heading_weight: 1.6
    joint_pose_axis_along_weight: 1.0

    # One camera-atomic macro: DRIVE_REL or TURN-MOVE-TURN.  There is no camera
    # callback between the sub-primitives; a fresh RGB-D reset follows the macro.
    joint_pose_maximum_steering_turn_deg: 16.0
    joint_pose_maximum_heading_step_deg: 8.0
    joint_pose_minimum_coupled_steering_deg: 1.0
    joint_pose_minimum_drive_radius_m: 0.09
    joint_pose_minimum_drive_yaw_deg: 0.45
    joint_pose_drive_yaw_levels: 3
    joint_pose_macro_action_cost: 0.03
    joint_pose_dogleg_cost_penalty: 0.03
    joint_pose_minimum_macro_improvement: 0.04
    joint_pose_maximum_cross_track_regression_m: 0.006
    joint_pose_maximum_heading_regression_deg: 8.0

    # Axial-orientation fusion.  A zero-net-yaw translation cannot physically
    # rotate a static object axis in base_link, so large apparent improvements
    # after retreat are clipped and receive only a very small measurement gain.
    joint_pose_orientation_translation_measurement_gain: 0.03
    joint_pose_orientation_stationary_measurement_gain: 0.20
    joint_pose_orientation_turn_measurement_gain: 0.45
    joint_pose_orientation_translation_innovation_limit_deg: 1.0
    joint_pose_orientation_turn_innovation_limit_deg: 12.0
    joint_pose_orientation_motion_yaw_epsilon_deg: 0.25

    # Bounded candidate budget.  execution_prefix_length now means the maximum
    # number of sub-primitives inside one atomic macro, not open-loop replans.
    joint_pose_position_resolution_m: 0.004
    joint_pose_orientation_resolution_deg: 2.0
    joint_pose_search_maximum_expansions: 25000
    joint_pose_search_maximum_wall_time_sec: 0.12
    joint_pose_search_maximum_depth: 3
    joint_pose_search_maximum_translation_m: 0.06
    joint_pose_search_maximum_turn_deg: 60.0
    joint_pose_heuristic_weight: 1.0
    joint_pose_execution_prefix_length: 3

    # Route preference, reversal hysteresis, and measured-cycle suppression.
    joint_pose_action_cost: 0.0
    joint_pose_motion_cost_weight: 0.04
    joint_pose_reverse_cost_penalty: 0.20
    joint_pose_drive_cost_penalty: 0.0
    joint_pose_action_family_change_penalty: 0.03
    joint_pose_immediate_reversal_penalty: 0.50
    joint_pose_same_direction_bonus: 0.02
    joint_pose_recent_cycle_penalty: 4.0
    joint_pose_hard_reject_recent_cycle: true
    joint_pose_cycle_position_radius_m: 0.010
    joint_pose_cycle_orientation_radius_deg: 5.0
    joint_pose_cycle_required_cost_improvement: 0.20
    joint_pose_minimum_frontier_improvement: 0.04

    # Logging, camera-reset model checking, and controlled hold behaviour.
    joint_pose_top_candidate_count: 8
    joint_pose_route_preview_count: 8
    joint_pose_history_size: 8
    joint_pose_hold_reobserve_sec: 0.30
    joint_pose_hold_limit: 8
    joint_pose_stall_limit: 5
    joint_pose_stall_step_shrink: 0.80
    joint_pose_minimum_step_scale: 0.35
    joint_pose_model_position_residual_tolerance_m: 0.018
    joint_pose_model_orientation_residual_tolerance_deg: 8.0
    joint_pose_minimum_observed_position_change_m: 0.0015
    joint_pose_minimum_observed_orientation_change_deg: 0.5
    # macrobot_axis_coupled_macro_v3 END

macrobot_visible_pick_test:
  ros__parameters:
    detection_max_age_sec: 8.0
    default_timeout_sec: 2400.0
    start_finder: true
    stored_goal_retry_period_sec: 0.75
    stored_goal_ack_timeout_sec: 12.0
