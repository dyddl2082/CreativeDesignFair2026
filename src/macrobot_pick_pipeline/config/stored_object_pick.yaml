macrobot_stored_object_pick:
  ros__parameters:
    # Runtime adapter store. The team-owned public object schema can replace
    # this file through an adapter without changing the ROS goal/result API.
    profile_file: ~/MacRobot/data/stored_objects/runtime_profiles.yaml
    recordings_dir: ~/MacRobot/data/arm_primitives
    grasp_keyframe_profile_file: ~/MacRobot/data/grasp_keyframes/profiles.yaml

    base_frame: base_link
    forward_axis_sign: -1.0
    lateral_axis_sign: 1.0

    # Current Pico serial conventions.
    pico_turn_positive_is_right: true
    pico_move_positive_is_forward: true

    # Set true only to inspect state transitions without moving the chassis.
    dry_run_base: false

    # Keep the arm compact before coarse chassis motion.
    stow_before_base_motion: true
    stow_q: [0.0, 0.0, 0.0]
    stow_timeout_sec: 20.0

    # Finder only emits temporally confirmed results. Keep this separate from
    # the per-object DINO similarity threshold managed by threshold profiles.
    minimum_score: 0.0
    stability_count: 5
    stability_window_sec: 1.5
    stability_radius_m: 0.012
    minimum_localization_quality: 0.15
    maximum_depth_std_m: 0.035
    maximum_center_std_px: 20.0
    require_orientation_match: false
    minimum_orientation_quality: 0.25
    auto_require_orientation_quality: 0.65
    orientation_tolerance_deg: 25.0

    # Reproduce the camera-relative pose that was recorded as graspable.
    bearing_tolerance_deg: 2.0
    range_tolerance_m: 0.015
    height_tolerance_m: 0.030
    max_turn_step_deg: 8.0
    max_move_step_m: 0.040

    # The tracked chassis needs substantial PWM to rotate.  Keep turn speed at
    # the calibrated operating value rather than the former 70 PWM default.
    alignment_turn_speed: 150
    alignment_move_speed: 80
    coarse_turn_speed: 150
    coarse_move_speed: 80
    base_motion_timeout_sec: 10.0
    settle_sec: 0.45

    max_alignment_iterations: 20
    max_alignment_total_turn_deg: 120.0
    max_alignment_total_move_m: 0.60
    alignment_confirmation_count: 2

    record_timeout_sec: 30.0
    visible_test_timeout_sec: 20.0
    full_search_timeout_sec: 90.0
    overall_timeout_sec: 180.0
    odom_request_timeout_sec: 2.0
    cancel_confirm_timeout_sec: 4.0

    # A recorded position is valid only in the same Pico odometry session.
    # If Pico time appears to have restarted, full mode fails safe.
    pico_reboot_tolerance_ms: 2000
    allow_missing_grasp_trajectory: false
    timer_rate_hz: 20.0

macrobot_visible_pick_test:
  ros__parameters:
    detection_max_age_sec: 1.5
    default_timeout_sec: 120.0
