/**:
  ros__parameters:
    # Logical model and four-bar constraints.
    q1_min: -1.0
    q1_max: 1.0
    q2_min: -1.30
    q2_max: 1.30
    q3_min: -1.25
    q3_max: 0.0
    tool_pitch_min: -2.0
    tool_pitch_max: 2.0
    four_bar_margin_rad: 0.1745329252

    # q=[0,0,0] is the CAD/kinematic home used for installation.
    home_q1: 0.0
    home_q2: 0.0
    home_q3: 0.0

    # MG996R lift actuator.
    lift_channel: 0
    lift_pulse_min_us: 500.0
    lift_pulse_center_us: 1500.0
    lift_pulse_max_us: 2500.0
    lift_zero_deg: 90.0
    lift_sign: 1.0
    lift_model_multiplier: -2.0
    lift_command_min_deg: 10.0
    lift_command_max_deg: 170.0

    # MG996R wrist/tilt actuator; model input is q1+q2.
    tilt_channel: 1
    tilt_pulse_min_us: 500.0
    tilt_pulse_center_us: 1500.0
    tilt_pulse_max_us: 2500.0
    tilt_zero_deg: 90.0
    tilt_sign: -1.0
    tilt_model_multiplier: 2.0
    tilt_command_min_deg: 10.0
    tilt_command_max_deg: 170.0

    # MG90S gripper actuator. q3=0 open, q3=-1.25 closed.
    gripper_channel: 2
    gripper_pulse_min_us: 500.0
    gripper_pulse_center_us: 1500.0
    gripper_pulse_max_us: 2500.0
    # Default mounting: open at 161.6197 deg, close at 18.3803 deg.
    gripper_zero_deg: 0.0
    gripper_sign: 1.0
    gripper_model_multiplier: 2.0
    gripper_command_min_deg: 0.0
    gripper_command_max_deg: 160.0
