# Generated ros2_control controllers
# Publishes joint states on: /joint_states
# Command topics use: /<controller_name>/commands
/**:
  controller_manager:
    ros__parameters:
      update_rate: 100

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      position_controller:
        type: forward_command_controller/ForwardCommandController
      velocity_controller:
        type: forward_command_controller/ForwardCommandController

  joint_state_broadcaster:
    ros__parameters: {}

  # Command topic: /position_controller/commands
  position_controller:
    ros__parameters:
      joints: [back_left_wheel_joint, back_right_wheel_joint, clamp_left_addition_joint, clamp_right_addition_joint, front_left_wheel_joint, front_right_wheel_joint, gripper_joint, gripper_left_addition_joint, gripper_left_gear_joint, gripper_right_addition_joint, gripper_right_gear_joint, gripper_servo_joint, robot_arm_joint]
      interface_name: position

  # Command topic: /velocity_controller/commands
  velocity_controller:
    ros__parameters:
      joints: [back_left_wheel_joint, back_right_wheel_joint, clamp_left_addition_joint, clamp_right_addition_joint, front_left_wheel_joint, front_right_wheel_joint, gripper_joint, gripper_left_addition_joint, gripper_left_gear_joint, gripper_right_addition_joint, gripper_right_gear_joint, gripper_servo_joint, robot_arm_joint]
      interface_name: velocity
