schema_version: 2
conventions:
  pulse_range_us: [500.0, 2500.0]
  servo_angle_range_deg: [0.0, 180.0]
  viewed_from: protruding output-shaft side
  positive_servo_angle: counterclockwise

actuators:
  left_tilt_mg996r:
    channel: 0
    logical_input: q1 (legacy joint name arm_lift_joint)
    home_servo_deg: 90.0
    command_formula: servo_deg = 90 + degrees(2*q1)
    positive_effect: arm tilts forward
    direction: counterclockwise
    pulse_min_us: 500.0
    pulse_center_us: 1500.0
    pulse_max_us: 2500.0

  right_lift_mg996r:
    channel: 1
    logical_input: rear_lift_angle = q1 + q2
    home_servo_deg: 90.0
    command_formula: servo_deg = 90 - degrees(2*(q1+q2))
    positive_effect: rear linkage rises
    direction: clockwise
    pulse_min_us: 500.0
    pulse_center_us: 1500.0
    pulse_max_us: 2500.0

  gripper_mg90s:
    channel: 2
    logical_input: q3 (gripper_joint)
    home_servo_deg: 0.0
    command_formula: servo_deg = degrees(2*q3)
    positive_effect: gripper closes
    direction: counterclockwise
    open_q3_rad: 0.0
    closed_q3_rad: 1.57079632679
    pulse_min_us: 500.0
    pulse_center_us: 1500.0
    pulse_max_us: 2500.0
