/**:
  ros__parameters:
    base_frame: base_link
    tool_frame: grasp_frame
    logical_state_topic: /macrobot/arm/logical_joint_states
    full_joint_state_topic: /joint_states
    target_topic: /macrobot/arm/target_point
    solution_topic: /macrobot/arm/ik_solution
    status_topic: /macrobot/arm/ik_status
    tool_pose_topic: /macrobot/arm/tool_pose
    gripper_gap_topic: /macrobot/gripper/gap

    # Geometry recovered from the new Fusion export.
    pivot_x: 0.02095
    pivot_y: 0.06340
    pivot_z: 0.064595
    main_link_length: 0.10000

    # Nominal open-jaw grasp center, relative to the main-arm endpoint/wrist.
    # Derived from the midpoint of the two clamp collision centroids.
    tool_offset_x: -0.184756
    tool_offset_z: -0.006000
    tool_y: 0.064500

    # Symmetric gripper four-bar dimensions.
    gripper_link_length: 0.03000
    gripper_base_separation: 0.01000

    # Logical arm constraints.  q2 is kept away from the four-bar toggle at +/- pi/2.
    arm_lift_min: -1.0
    arm_lift_max: 1.0
    wrist_pitch_min: -1.30
    wrist_pitch_max: 1.30
    tool_pitch_min: -2.0
    tool_pitch_max: 2.0
    four_bar_margin: 0.174533

    # q3=0 is fully open. Negative q3 closes the jaws.
    # The current CAD range is -1.25 rad (closed) to 0 rad (open).
    gripper_min: -1.25
    gripper_max: 0.0

    # Full Fusion arm joint names.
    lift_servo_joint: servo_left_gear_joint
    tilt_servo_joint: servo_right_gear_joint
    lift_ratio_joint: ratio_left_gear_joint
    tilt_ratio_joint: ratio_right_gear_joint
    rear_passive_joint: ratio_left_gear_back_link_joint
    top_passive_joint: back_link_top_link_joint

    # Confirmed 20:40 external gear pairs.
    lift_servo_multiplier: -2.0
    tilt_servo_multiplier: 2.0

    # Full Fusion gripper joint names and inferred 1:2 actuator gear ratio.
    gripper_servo_joint: gripper_servo_joint
    gripper_left_gear_joint: gripper_left_gear_joint
    gripper_right_gear_joint: gripper_right_gear_joint
    gripper_left_addition_joint: gripper_left_addition_joint
    gripper_right_addition_joint: gripper_right_addition_joint
    gripper_left_clamp_joint: clamp_left_addition_joint
    gripper_right_clamp_joint: clamp_right_addition_joint
    gripper_servo_multiplier: 2.0

    publish_full_joint_states: true
    publish_rate: 30.0
    auto_apply_ik: false
    seed_weight: 0.001
