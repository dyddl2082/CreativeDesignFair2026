api:
  name: macrobot_llm_robot_api
  version: 0.2.0
  facade: robot
  entrypoint: main
  entrypoint_return: TaskOutcome
conventions:
  distance_unit: meter
  angle_unit: degree
  time_unit: second
  positive_linear_direction: forward
  positive_angular_direction: counterclockwise
  direct_ros_access_allowed: false
  direct_file_access_allowed: false
  direct_import_allowed: false
resources:
  BASE_MOTION:
    waitable: true
  ARM_MOTION:
    waitable: true
  GRIPPER_MOTION:
    waitable: true
  PICO_MOTION:
    waitable: true
  POSITION_STORE:
    waitable: false
  ARM_PRIMITIVE_STORE:
    waitable: false
functions:
  WAIT_SECOND:
    mode: sync
    returns: OperationResult
    args:
      seconds: float
  WAIT_ACTION:
    mode: sync
    returns: ActionResult
    cancel_on_timeout: true
    args:
      action: ActionHandle
      timeout_s: float
  WAIT_RESOURCE:
    mode: sync
    returns: OperationResult
    reserves_resource: false
    args:
      resource_id: ResourceId
      timeout_s: float
  CHECK_ACTION:
    mode: sync
    returns: ActionResult
    args:
      action: ActionHandle
  CANCEL_ACTION:
    mode: sync
    returns: ActionResult
    args:
      action: ActionHandle
  CANCEL_ALL:
    mode: sync
    returns: OperationResult
    scope: current_run
  STOP:
    mode: sync
    returns: OperationResult
    scope: system_motion
    blocks_new_motion_in_current_run: true
  GET_OBJECT_STATE:
    mode: sync
    returns: ObjectStateResult
    args:
      object_id: ObjectId
  GET_ROBOT_POS:
    mode: sync
    returns: RobotPosResult
  MOVE_BASE:
    mode: async
    returns: ActionHandle
    resources:
    - BASE_MOTION
    - PICO_MOTION
    args:
      distance_m: float
  TURN_BASE:
    mode: async
    returns: ActionHandle
    resources:
    - BASE_MOTION
    - PICO_MOTION
    args:
      angle_deg: float
  SAVE_POS:
    mode: sync
    returns: OperationResult
    resources:
    - POSITION_STORE
    requires_idle:
    - BASE_MOTION
    args:
      position_id: str
      overwrite: bool
  MOVE_BASE_TO_POS:
    mode: async
    returns: ActionHandle
    resources:
    - BASE_MOTION
    - PICO_MOTION
    args:
      position_id: str
  ALIGN_WITH_OBJECT:
    mode: async
    returns: ActionHandle
    resources:
    - BASE_MOTION
    - PICO_MOTION
    args:
      object_id: ObjectId
  SET_ARM_JOINTS:
    mode: async
    returns: ActionHandle
    resources:
    - ARM_MOTION
    - PICO_MOTION
    preserves:
    - gripper_deg
    args:
      arm_lift_deg: float
      wrist_pitch_deg: float
  SET_GRIPPER:
    mode: async
    returns: ActionHandle
    resources:
    - GRIPPER_MOTION
    - PICO_MOTION
    preserves:
    - arm_lift_deg
    - wrist_pitch_deg
    args:
      gripper_deg: float
  SAVE_ARM_PRIMITIVE:
    mode: sync
    returns: OperationResult
    stores:
    - arm_lift_deg
    - wrist_pitch_deg
    excludes:
    - gripper_deg
    args:
      primitive_id: str
      overwrite: bool
  SET_ARM_PRIMITIVE:
    mode: async
    returns: ActionHandle
    resources:
    - ARM_MOTION
    - PICO_MOTION
    preserves:
    - gripper_deg
    args:
      primitive_id: str
  PICK_OBJECT:
    mode: async
    returns: ActionHandle
    resources:
    - BASE_MOTION
    - ARM_MOTION
    - GRIPPER_MOTION
    - PICO_MOTION
    args:
      object_id: ObjectId
  PLACE_NEXTTO_OBJECT:
    mode: async
    returns: ActionHandle
    resources:
    - BASE_MOTION
    - ARM_MOTION
    - GRIPPER_MOTION
    - PICO_MOTION
    args:
      reference_object_id: ObjectId
    execution: visual_reference_search_then_reverse_pick_sequence
    placement_offset_source: object_catalog_or_gateway_default
    verification: commanded_sequence_only
    current_runtime_status: safe_fail_until_placement_profile_is_defined
