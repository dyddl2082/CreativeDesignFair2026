aligned_depth_candidate:
  ros__parameters:
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    candidate_topic: /depth_candidates/candidates
    debug_topic: /depth_candidates/debug/compressed
    process_hz: 5.0
    depth_scale_m: 0.001
    min_depth_m: 0.15
    max_depth_m: 1.2
    enable_plane_removal: true
    plane_sample_stride: 4
    plane_ransac_iterations: 70
    plane_distance_threshold_m: 0.012
    plane_min_inlier_ratio: 0.25
    plane_clearance_m: 0.004
    plane_max_foreground_m: 1.0
    max_plane_samples: 16000
    fallback_background_percentile: 70.0
    fallback_clearance_m: 0.008
    roi_top_ratio: 0.0
    roi_bottom_ratio: 1.0
    roi_left_ratio: 0.0
    roi_right_ratio: 1.0
    close_kernel_px: 5
    open_kernel_px: 1
    min_component_area_px: 25
    max_component_area_ratio: 0.8
    min_bbox_width_px: 4
    min_bbox_height_px: 4
    min_fill_ratio: 0.005
    min_valid_depth_ratio: 0.55
    bbox_padding_px: 16
    border_margin_px: 2
    reject_border_components: false
    max_candidates: 12
    depth_std_score_scale_m: 0.08
    random_seed: 17
    publish_debug: true
    debug_hz: 1.0
    debug_jpeg_quality: 45
    debug_scale: 0.5
rgb_candidate_crop:
  ros__parameters:
    color_topic: /camera/camera/color/image_raw
    candidate_topic: /depth_candidates/candidates
    crop_topic: /depth_candidates/rgb_crops
    top_crop_preview_topic: /depth_candidates/top_rgb_crop/compressed
    color_buffer_size: 60
    sync_tolerance_sec: 0.12
    allow_latest_color_fallback: false
    max_crops_per_frame: 40
    min_proposal_score: 0.0
    reject_border_candidates: false
    extra_padding_px: 32
    extra_padding_ratio: 0.8
    max_crop_side_px: 512
    min_crop_side_px: 24
    jpeg_quality: 70
    min_jpeg_quality: 35
    jpeg_quality_step: 8
    max_jpeg_bytes: 120000
    jpeg_resize_factor: 0.8
    jpeg_max_resize_iterations: 6
    reliable_crop_output: false
    publish_foreground_mask: true
    mask_png_compression: 3
    publish_top_crop_preview: false
    top_crop_preview_hz: 0.5
    status_log_period_sec: 5.0
    force_square_crop: true
    min_context_side_px: 180
    max_context_side_px: 480
