aligned_depth_candidate:
  ros__parameters:
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    candidate_topic: /depth_candidates/candidates
    debug_topic: /depth_candidates/debug/compressed

    # Pi-side proposal rate. It is an upper bound, not a guaranteed rate.
    process_hz: 5.0

    depth_scale_m: 0.001
    min_depth_m: 0.20
    max_depth_m: 0.85

    enable_plane_removal: true
    plane_sample_stride: 4
    plane_ransac_iterations: 70

    plane_distance_threshold_m: 0.012
    plane_min_inlier_ratio: 0.25
    plane_clearance_m: 0.012

    plane_max_foreground_m: 0.80
    max_plane_samples: 16000

    fallback_background_percentile: 70.0
    fallback_clearance_m: 0.025

    roi_top_ratio: 0.00
    roi_bottom_ratio: 1.00
    roi_left_ratio: 0.00
    roi_right_ratio: 1.00

    close_kernel_px: 7
    open_kernel_px: 5

    min_component_area_px: 80
    max_component_area_ratio: 0.1

    min_bbox_width_px: 16
    min_bbox_height_px: 16

    min_fill_ratio: 0.08

    min_valid_depth_ratio: 0.55
    bbox_padding_px: 6
    border_margin_px: 2
    reject_border_components: false
    max_candidates: 12
    depth_std_score_scale_m: 0.060
    random_seed: 17

    # Lightweight depth debug stream. 0.5 means 320x240 from 640x480 input.
    publish_debug: true
    debug_hz: 2.0
    debug_jpeg_quality: 50
    debug_scale: 0.5

rgb_candidate_crop:
  ros__parameters:
    color_topic: /camera/camera/color/image_raw
    candidate_topic: /depth_candidates/candidates
    crop_topic: /depth_candidates/rgb_crops
    top_crop_preview_topic: /depth_candidates/top_rgb_crop/compressed

    # Retain enough historical color frames to match a proposal after depth
    # processing latency. 45 RGB8 640x480 frames use roughly 42 MiB.
    color_buffer_size: 45
    sync_tolerance_sec: 0.080
    allow_latest_color_fallback: false

    # Proposals are already sorted by proposal_score.
    max_crops_per_frame: 6
    min_proposal_score: 0.05
    reject_border_candidates: false

    # The depth proposal ROI already includes bbox_padding_px. Keep extra
    # padding at zero initially; add context later if embedding accuracy needs it.
    extra_padding_px: 8
    extra_padding_ratio: 0.15

    # Network-oriented crop encoding. One crop is one DDS sample.
    max_crop_side_px: 324
    min_crop_side_px: 32
    jpeg_quality: 70
    min_jpeg_quality: 35
    jpeg_quality_step: 8
    max_jpeg_bytes: 90000
    jpeg_resize_factor: 0.80
    jpeg_max_resize_iterations: 6

    # Best effort favors current crops over retransmitting stale frames.
    reliable_crop_output: false

    publish_foreground_mask: true
    mask_png_compression: 3

    # Low-rate standard CompressedImage stream for image_view testing.
    publish_top_crop_preview: true
    top_crop_preview_hz: 1.0
    status_log_period_sec: 5.0
