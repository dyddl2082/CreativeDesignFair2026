real_motion_enabled: false
run_limits:
  max_wall_time_s: 300.0
  max_internal_motion_steps_per_run: 40
control_limits:
  max_wait_seconds_per_call: 60.0
  max_wait_action_timeout_s: 180.0
  max_wait_resource_timeout_s: 120.0
control_timeouts:
  cancel_action_s: 4.0
  cancel_all_s: 5.0
  stop_s: 5.0
base_limits:
  max_move_distance_m_per_call: 1.0
  max_turn_angle_deg_per_call: 180.0
base_timeouts:
  move_base_s: 15.0
  turn_base_s: 15.0
  move_base_to_pos_s: 45.0
base_motion:
  move_speed: 80
  turn_speed: 150
  move_tolerance_m: 0.01
  turn_tolerance_deg: 1.0
alignment:
  max_motion_steps_per_call: 20
  hard_timeout_s: 90.0
arm_limits:
  arm_lift_deg:
  - -57.3
  - 57.3
  wrist_pitch_deg:
  - -74.5
  - 74.5
arm_timeouts:
  set_arm_joints_s: 20.0
  set_arm_primitive_s: 20.0
gripper_limits:
  logical_deg:
  - 0.0
  - 90.0
gripper_timeouts:
  set_gripper_s: 12.0
manipulation:
  pick_max_motion_steps_per_call: 30
  place_max_motion_steps_per_call: 30
  pick_hard_timeout_s: 150.0
  place_hard_timeout_s: 150.0
  grasp_verification_policy: commanded_sequence_only
  placement_verification_policy: not_implemented
perception:
  object_state_max_age_ms: 1500
  health_max_age_ms: 5000
robot_state:
  base_state_max_age_ms: 10000
  arm_state_max_age_ms: 5000
  gripper_state_max_age_ms: 5000
dry_run:
  simulated_motion_sec: 0.05
