aligned_depth_candidate:
  ros__parameters:
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    candidate_topic: /depth_candidates/candidates
    debug_topic: /depth_candidates/debug/compressed

    # Pi-side proposal rate.
    process_hz: 5.0

    # D435 Z16 raw depth: millimeter -> meter
    depth_scale_m: 0.001
    min_depth_m: 0.18
    max_depth_m: 1.50

    # Dominant table/floor plane removal
    enable_plane_removal: true
    plane_sample_stride: 4
    plane_ransac_iterations: 70
    plane_distance_threshold_m: 0.012
    plane_min_inlier_ratio: 0.25
    plane_clearance_m: 0.025
    plane_max_foreground_m: 0.60
    max_plane_samples: 16000

    # Fallback when CameraInfo/plane fitting is unavailable
    fallback_background_percentile: 70.0
    fallback_clearance_m: 0.035

    # Full image ROI
    roi_top_ratio: 0.00
    roi_bottom_ratio: 1.00
    roi_left_ratio: 0.00
    roi_right_ratio: 1.00

    # Foreground-mask cleanup
    close_kernel_px: 9
    open_kernel_px: 3

    # Connected-component filtering
    min_component_area_px: 300
    max_component_area_ratio: 0.28
    min_bbox_width_px: 14
    min_bbox_height_px: 14
    min_fill_ratio: 0.10
    min_valid_depth_ratio: 0.55

    bbox_padding_px: 8
    border_margin_px: 2
    reject_border_components: false

    max_candidates: 12
    depth_std_score_scale_m: 0.060
    random_seed: 17

    # Pi-side depth debug stream
    publish_debug: true
    debug_hz: 2.0
    debug_jpeg_quality: 50
    debug_scale: 0.5


rgb_candidate_crop:
  ros__parameters:
    color_topic: /camera/camera/color/image_raw
    candidate_topic: /depth_candidates/candidates
    crop_topic: /depth_candidates/rgb_crops
    top_crop_preview_topic: /depth_candidates/top_rgb_crop/compressed

    # RGB frame buffer and depth/RGB time matching
    color_buffer_size: 45
    sync_tolerance_sec: 0.080
    allow_latest_color_fallback: false

    # Candidate selection
    max_crops_per_frame: 6
    min_proposal_score: 0.0
    reject_border_candidates: false

    # Original ROI behavior: no additional high-recall expansion
    extra_padding_px: 0
    extra_padding_ratio: 0.0

    # Bounded JPEG encoding
    max_crop_side_px: 320
    min_crop_side_px: 32
    jpeg_quality: 70
    min_jpeg_quality: 35
    jpeg_quality_step: 8
    max_jpeg_bytes: 55000
    jpeg_resize_factor: 0.80
    jpeg_max_resize_iterations: 6

    # Live crops favor freshness over retransmission
    reliable_crop_output: false

    # Optional Pi-side preview
    publish_top_crop_preview: true
    top_crop_preview_hz: 1.0
    status_log_period_sec: 5.0