/**:
  ros__parameters:
    # Logical model and four-bar constraints.
    # q1 (legacy arm_lift_joint): positive arm-forward tilt.
    # q2 (legacy wrist_pitch_joint): relative rear-lift coordinate.
    # absolute right driven/rear-lift angle = q1 + q2.
    q1_min: -1.0
    q1_max: 1.0
    q2_min: -1.30
    q2_max: 1.30
    q3_min: 0.0
    q3_max: 1.57079632679
    tool_pitch_min: -2.0
    tool_pitch_max: 2.0
    four_bar_margin_rad: 0.1745329252

    # q=[0,0,0] is the CAD/kinematic home.
    home_q1: 0.0
    home_q2: 0.0
    home_q3: 0.0

    # CH0, left MG996R: CCW viewed from shaft => arm tilts forward.
    lift_channel: 0
    lift_pulse_min_us: 500.0
    lift_pulse_center_us: 1500.0
    lift_pulse_max_us: 2500.0
    lift_zero_deg: 90.0
    lift_sign: 1.0
    lift_model_multiplier: 2.0
    lift_command_min_deg: 0.0
    lift_command_max_deg: 180.0

    # CH1, right MG996R: CW viewed from shaft => rear linkage rises.
    # Positive rear_lift_angle=q1+q2 therefore decreases servo command angle.
    tilt_channel: 1
    tilt_pulse_min_us: 500.0
    tilt_pulse_center_us: 1500.0
    tilt_pulse_max_us: 2500.0
    tilt_zero_deg: 90.0
    tilt_sign: 1.0
    tilt_model_multiplier: -2.0
    tilt_command_min_deg: 0.0
    tilt_command_max_deg: 180.0

    # CH2, MG90S: 0 deg/open; CCW to 180 deg/closed.
    # q3 is the driven gear angle, so q3=pi/2 produces 180 deg at the servo.
    gripper_channel: 2
    gripper_pulse_min_us: 500.0
    gripper_pulse_center_us: 1500.0
    gripper_pulse_max_us: 2500.0
    gripper_zero_deg: 0.0
    gripper_sign: 1.0
    gripper_model_multiplier: 2.0
    gripper_command_min_deg: 0.0
    gripper_command_max_deg: 180.0
