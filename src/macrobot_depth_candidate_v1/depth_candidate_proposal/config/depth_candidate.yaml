aligned_depth_candidate:
  ros__parameters:
    depth_topic: /camera/camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    candidate_topic: /depth_candidates/candidates
    debug_topic: /depth_candidates/debug/compressed

    # Pi-side processing rate. Start conservatively and raise after measuring CPU.
    process_hz: 5.0

    # RealSense Z16 is normally converted with 0.001 m per raw unit.
    # Keep this explicit and verify the topic encoding on the actual camera.
    depth_scale_m: 0.001
    min_depth_m: 0.18
    max_depth_m: 1.50

    # Dominant table/floor/wall removal.
    enable_plane_removal: true
    plane_sample_stride: 4
    plane_ransac_iterations: 70
    plane_distance_threshold_m: 0.012
    plane_min_inlier_ratio: 0.25
    plane_clearance_m: 0.025
    plane_max_foreground_m: 0.60
    max_plane_samples: 16000

    # Used automatically until CameraInfo arrives or when plane fitting fails.
    fallback_background_percentile: 70.0
    fallback_clearance_m: 0.035

    # Image working area. Change bottom_ratio if the robot body enters the view.
    roi_top_ratio: 0.00
    roi_bottom_ratio: 1.00
    roi_left_ratio: 0.00
    roi_right_ratio: 1.00

    # Binary-mask cleanup.
    close_kernel_px: 9
    open_kernel_px: 3

    # Connected-component filtering for a 640x480 starting profile.
    min_component_area_px: 300
    max_component_area_ratio: 0.28
    min_bbox_width_px: 14
    min_bbox_height_px: 14
    min_fill_ratio: 0.10
    min_valid_depth_ratio: 0.55
    bbox_padding_px: 8
    border_margin_px: 2
    reject_border_components: false
    max_candidates: 12
    depth_std_score_scale_m: 0.060
    random_seed: 17

    # Low-rate JPEG debug output for WSL2 tuning.
    publish_debug: true
    debug_hz: 2.0
    debug_jpeg_quality: 72
